<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitArch - Analysis Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: #fcfbf7;
            color: #1f2937;
            min-height: 100vh;
        }

        .top-line {
            width: 100%;
            height: 4px;
            background: #1f2937;
        }

        header {
            position: relative;
            z-index: 10;
            border-bottom: 3px solid #1f2937;
            background: #fff;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
            color: #1f2937;
            letter-spacing: -0.02em;
        }
        .logo .logo-accent { color: #2563eb; }
        .repo-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .repo-info a {
            color: #4b5563;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .repo-info a:hover { color: #1f2937; }
        .btn-back {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 3px solid #1f2937;
            background: #e5e7eb;
            color: #1f2937;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.08s ease;
            box-shadow: 3px 3px 0px #1f2937;
        }
        .btn-back:hover {
            background: #d1d5db;
            box-shadow: 1px 1px 0px #1f2937;
            transform: translate(1px, 1px);
        }
        .btn-back:active {
            box-shadow: 0px 0px 0px #1f2937;
            transform: translate(2px, 2px);
        }

        .tabs-wrapper {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #fff;
            border-bottom: 3px solid #1f2937;
        }
        .tabs {
            display: flex;
            gap: 0;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 0.85rem 1.2rem;
            background: none;
            border: none;
            color: #6b7280;
            font-size: 0.88rem;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tab-btn:hover { color: #1f2937; }
        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }
        .tab-icon { font-size: 0.95rem; }

        .content {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.25s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content h1 {
            font-size: 1.5rem;
            margin-bottom: 1.2rem;
            color: #2563eb;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .markdown-body {
            line-height: 1.8;
            font-size: 0.95rem;
        }
        .markdown-body h2 {
            font-size: 1.2rem;
            margin-top: 2rem;
            margin-bottom: 0.6rem;
            color: #1f2937;
            border-bottom: 2px solid #1f2937;
            padding-bottom: 0.4rem;
            font-weight: 700;
        }
        .markdown-body h3 {
            font-size: 1rem;
            margin-top: 1.4rem;
            margin-bottom: 0.4rem;
            color: #374151;
            font-weight: 600;
        }
        .markdown-body p { margin-bottom: 0.8rem; }
        .markdown-body ul, .markdown-body ol {
            margin-bottom: 0.8rem;
            padding-left: 1.5rem;
        }
        .markdown-body li { margin-bottom: 0.3rem; }
        .markdown-body code {
            background: #e5e7eb;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.88rem;
            color: #1f2937;
            border: 1px solid #d1d5db;
        }
        .markdown-body pre {
            background: #f9fafb;
            border: 2px solid #1f2937;
            border-radius: 8px;
            padding: 1rem;
            margin: 0.8rem 0;
            overflow-x: auto;
            box-shadow: 3px 3px 0px #1f2937;
        }
        .markdown-body pre code {
            background: none;
            padding: 0;
            color: #1f2937;
            border: none;
        }
        .markdown-body strong { color: #1f2937; }
        .markdown-body a { color: #2563eb; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }

        .file-tree-container {
            background: #f9fafb;
            border: 2px solid #1f2937;
            border-radius: 8px;
            padding: 1.2rem 1.5rem;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #374151;
            box-shadow: 3px 3px 0px #1f2937;
        }

        .mermaid-container {
            background: #fff;
            border: 2px solid #1f2937;
            border-radius: 10px;
            padding: 2rem;
            margin: 1.2rem 0;
            text-align: center;
            overflow-x: auto;
            box-shadow: 3px 3px 0px #1f2937;
        }

        @media (max-width: 640px) {
            .content { padding: 1rem; }
            h1 { font-size: 1.2rem; }
            .tabs { gap: 0; }
            .tab-btn { padding: 0.7rem 0.8rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="top-line"></div>

    <header>
        <div class="header-inner">
            <a href="/" class="logo">Git<span class="logo-accent">Arch</span></a>
            <div class="repo-info">
                <a href="{{ repo_url }}" target="_blank">{{ repo_url.split('/')[-2] }}/{{ repo_url.split('/')[-1] }}</a>
                <a href="/" class="btn-back">← New Analysis</a>
            </div>
        </div>
    </header>

    <div class="tabs-wrapper">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('summary')">
                <span class="tab-icon">📋</span> Summary
            </button>
            <button class="tab-btn" onclick="switchTab('code')">
                <span class="tab-icon">📄</span> Code
            </button>
            <button class="tab-btn" onclick="switchTab('structure')">
                <span class="tab-icon">📁</span> Structure
            </button>
            <button class="tab-btn" onclick="switchTab('architecture')">
                <span class="tab-icon">🏗️</span> Architecture
            </button>
            <button class="tab-btn" onclick="switchTab('quality')">
                <span class="tab-icon">🔍</span> Quality
            </button>
            <button class="tab-btn" onclick="switchTab('features')">
                <span class="tab-icon">💡</span> Features
            </button>
        </div>
    </div>

    <div class="content">
        <div id="tab-summary" class="tab-content active">
            <h1>Project Summary</h1>
            <div class="markdown-body" id="md-summary"></div>
        </div>
        <div id="tab-code" class="tab-content">
            <h1>Code Overview</h1>
            <div class="markdown-body" id="md-code"></div>
        </div>
        <div id="tab-structure" class="tab-content">
            <h1>Repository Structure</h1>
            <div class="file-tree-container">
                <pre id="raw-tree">{{ file_tree }}</pre>
            </div>
            <div class="markdown-body" id="md-structure" style="margin-top:1.5rem"></div>
        </div>
        <div id="tab-architecture" class="tab-content">
            <h1>Architecture</h1>
            <div class="markdown-body" id="md-architecture"></div>
        </div>
        <div id="tab-quality" class="tab-content">
            <h1>Code Quality</h1>
            <div class="markdown-body" id="md-quality"></div>
        </div>
        <div id="tab-features" class="tab-content">
            <h1>Feature Suggestions</h1>
            <div class="markdown-body" id="md-features"></div>
        </div>
    </div>

    <script>
        const rawData = {
            summary: {{ summary | tojson }},
            code: {{ code_overview | tojson }},
            structure: {{ structure | tojson }},
            architecture: {{ architecture | tojson }},
            quality: {{ quality | tojson }},
            features: {{ features | tojson }},
        };

        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            theme: 'neutral',
            themeVariables: {
                primaryColor: '#dbeafe',
                primaryTextColor: '#1f2937',
                primaryBorderColor: '#1f2937',
                lineColor: '#2563eb',
                secondaryColor: '#f3f4f6',
                tertiaryColor: '#fff',
                fontFamily: "'Plus Jakarta Sans', system-ui, sans-serif",
                fontSize: '14px',
            }
        });

        function sanitizeMermaid(code) {
            let cleaned = code.trim();
            cleaned = cleaned.replace(/^\s*```mermaid\s*/i, '').replace(/```\s*$/, '');
            cleaned = cleaned.replace(/%%.*$/gm, '');

            let lines = cleaned.split('\n').map(l => l.trimEnd()).filter(l => l.length > 0);

            lines = lines.map(line => {
                if (/^\s*(flowchart|graph|sequenceDiagram|classDiagram|stateDiagram|erDiagram|gantt|pie|gitgraph|mindmap|timeline|block-beta|subgraph|end)\b/i.test(line)) {
                    return line;
                }
                line = line.replace(/\[([^\]]*)\]/g, (match, label) => {
                    let clean = label.replace(/[()""''<>&#]/g, ' ').replace(/\s+/g, ' ').trim();
                    return '[' + clean + ']';
                });
                line = line.replace(/\|([^|]*)\|/g, (match, label) => {
                    let clean = label.replace(/[()""''<>&#]/g, ' ').replace(/\s+/g, ' ').trim();
                    return '|' + clean + '|';
                });
                return line;
            });

            let subgraphCount = 0;
            lines.forEach(l => {
                if (/^\s*subgraph\b/i.test(l)) subgraphCount++;
                if (/^\s*end\s*$/i.test(l)) subgraphCount--;
            });
            while (subgraphCount > 0) { lines.push('    end'); subgraphCount--; }

            return lines.join('\n');
        }

        function looksLikeMermaid(code) {
            const first = code.trim().split('\n')[0].trim().toLowerCase();
            const validStarts = ['flowchart', 'graph', 'sequencediagram', 'classdiagram',
                                 'statediagram', 'erdiagram', 'gantt', 'pie', 'gitgraph',
                                 'mindmap', 'timeline', 'block-beta'];
            return validStarts.some(s => first.startsWith(s));
        }

        async function tryRenderMermaid(id, code) {
            try {
                const { svg } = await mermaid.render(id, code);
                return { ok: true, svg };
            } catch (e) {
                return { ok: false, error: e.message || String(e) };
            }
        }

        function simplifyMermaid(code) {
            const lines = code.split('\n');
            if (lines.length <= 2) return null;
            const header = lines[0];
            const body = lines.slice(1).filter(l => {
                if (/^\s*subgraph\b/i.test(l) || /^\s*end\s*$/i.test(l)) return false;
                if (/^\s*style\b/i.test(l) || /^\s*classDef\b/i.test(l)) return false;
                return true;
            });
            if (body.length === 0) return null;
            return [header, ...body].join('\n');
        }

        async function renderMarkdown(elementId, text) {
            const el = document.getElementById(elementId);
            if (!text || text.trim() === '') {
                el.innerHTML = '<p style="color:#6b7280;font-style:italic">No data available for this section.</p>';
                return;
            }
            el.innerHTML = marked.parse(text);

            el.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });

            const mermaidBlocks = el.querySelectorAll('code.language-mermaid');
            for (let i = 0; i < mermaidBlocks.length; i++) {
                const raw = mermaidBlocks[i].textContent;
                const code = sanitizeMermaid(raw);
                const pre = mermaidBlocks[i].parentElement;
                const div = document.createElement('div');
                div.className = 'mermaid-container';

                if (!looksLikeMermaid(code)) {
                    div.innerHTML = `<p style="color:#6b7280;margin-bottom:0.5rem;font-size:0.85rem">Diagram source:</p><pre style="color:#374151;text-align:left;font-size:0.85rem;white-space:pre-wrap">${code}</pre>`;
                    pre.replaceWith(div);
                    continue;
                }

                let result = await tryRenderMermaid(`mermaid-${elementId}-${i}`, code);

                if (!result.ok) {
                    const simplified = simplifyMermaid(code);
                    if (simplified) {
                        result = await tryRenderMermaid(`mermaid-${elementId}-${i}-retry`, simplified);
                    }
                }

                if (result.ok) {
                    div.innerHTML = result.svg;
                } else {
                    div.innerHTML = `<p style="color:#6b7280;margin-bottom:0.5rem;font-size:0.85rem">Diagram source:</p><pre style="color:#374151;text-align:left;font-size:0.85rem;white-space:pre-wrap">${code}</pre>`;
                }
                pre.replaceWith(div);
            }
        }

        const tabNames = ['summary', 'code', 'structure', 'architecture', 'quality', 'features'];

        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${name}`).classList.add('active');
            document.querySelectorAll('.tab-btn')[tabNames.indexOf(name)].classList.add('active');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        (async function init() {
            await Promise.all([
                renderMarkdown('md-summary', rawData.summary),
                renderMarkdown('md-code', rawData.code),
                renderMarkdown('md-structure', rawData.structure),
                renderMarkdown('md-architecture', rawData.architecture),
                renderMarkdown('md-quality', rawData.quality),
                renderMarkdown('md-features', rawData.features),
            ]);
        })();
    </script>
</body>
</html>
